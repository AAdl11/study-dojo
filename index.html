<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1020">
<title>我的複習中心</title>
<style>
  :root{--bg:#0f1020;--panel:#1a1b34;--panel2:#232544;--ink:#eef0ff;--muted:#9aa0c9;--line:#33355e;
    --brand:#7c6cff;--brand2:#4dd6c0;--gold:#ffcc4d;--ok:#3ddc84;--shadow:0 10px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%,#26234d 0,transparent 55%),
               radial-gradient(1000px 600px at 110% 10%,#1c3b3a 0,transparent 50%),var(--bg);
    color:var(--ink);line-height:1.55;min-height:100%}
  .wrap{max-width:920px;margin:0 auto;padding:26px 16px 90px}
  header.hero{background:linear-gradient(135deg,#211f45,#181a33);border:1px solid var(--line);
    border-radius:22px;padding:24px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.hero::after{content:"🧭";position:absolute;right:20px;top:-14px;font-size:120px;opacity:.06}
  .kicker{color:var(--brand2);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
  h1{margin:.14em 0 .1em;font-size:29px;letter-spacing:.4px}
  .sub{color:var(--muted);font-size:14px}
  .sec{margin-top:30px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 4px 12px}
  .sec-h .em{font-size:22px}.sec-h .t{font-weight:800;font-size:18px}
  .sec-h .c{color:var(--muted);font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
  .sec.eng .sec-h .t{color:#8ff0df}.sec.psyc .sec-h .t{color:#b9afff}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
  .card{text-align:left;width:100%;cursor:pointer;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);color:var(--ink);
    transition:.18s;display:flex;flex-direction:column;gap:8px;font-family:inherit}
  .card:hover{transform:translateY(-3px);border-color:var(--brand)}
  .card:active{transform:translateY(0)}
  .card .ic{font-size:30px;line-height:1}.card .ct{font-weight:800;font-size:17px}
  .card .cd{color:var(--muted);font-size:13px;line-height:1.5}
  .card .go{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--brand2)}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .tag{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
  .foot{margin-top:34px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
  #player{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  #player.show{display:flex}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#12132a;border-bottom:1px solid var(--line);flex:0 0 auto}
  .back{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;border-radius:11px}
  .back:hover{border-color:var(--brand)}
  .bar .now{font-weight:700;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #frame{flex:1 1 auto;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div class="wrap" id="menu">
  <header class="hero">
    <div class="kicker">Final Study · 自己複習用</div>
    <h1>我的複習中心 🧭</h1>
    <div class="sub">英文和心理學分開放好了。點任何一個進去練，進度會自動記在這台裝置上。</div>
  </header>

  <section class="sec eng">
    <div class="sec-h"><span class="em">✍️</span><span class="t">英文寫作 · ENGL 7（主力）</span><span class="c">2 個</span></div>
    <div class="cards">
      <button class="card" data-game="critique">
        <div class="ic">🔎</div><div class="ct">批判文道場</div>
        <div class="cd">Essay 1 那種「批判」文——練評估作者論證的強弱，不要只同意。照教授的 rubric 做的。</div>
        <div class="tagrow"><span class="tag">Critique</span><span class="tag">6 關</span><span class="tag">你的指紋</span></div>
        <div class="go">進去練 →</div>
      </button>
      <button class="card" data-game="policy">
        <div class="ic">⚖️</div><div class="ct">政策主張道場</div>
        <div class="cd">Essay 2 那種「政策主張」文——練反方論證、They Say/I Say，還有一整關「AI 腔 vs 你的聲音」。</div>
        <div class="tagrow"><span class="tag">Claim of Policy</span><span class="tag">6 關</span><span class="tag">反方論證</span></div>
        <div class="go">進去練 →</div>
      </button>
    </div>
  </section>

  <section class="sec psyc">
    <div class="sec-h"><span class="em">🧠</span><span class="t">心理學 · PSYC C1000</span><span class="c">2 個</span></div>
    <div class="cards">
      <button class="card" data-game="psyc-hub">
        <div class="ic">📚</div><div class="ct">心智闖關學習中心</div>
        <div class="cd">15 章、329 個考點、90 題自我測驗。中文秒懂、英文應考——8/2 那場考試的複習主力。</div>
        <div class="tagrow"><span class="tag">15 章</span><span class="tag">90 題自測</span></div>
        <div class="go">進去複習 →</div>
      </button>
      <button class="card" data-game="psyc-schedule">
        <div class="ic">🗓️</div><div class="ct">心智闖關之旅（讀書排程）</div>
        <div class="cd">16 天每日讀書關卡：今天讀哪章、複習哪章、幾號自測。把行事曆變成遊戲。</div>
        <div class="tagrow"><span class="tag">16 天</span><span class="tag">間隔複習</span></div>
        <div class="go">看今天要做什麼 →</div>
      </button>
    </div>
  </section>

  <section class="sec psyc">
    <div class="sec-h"><span class="em">🔬</span><span class="t">心理學 · PSYC 4（Keller · Fall 2026）</span><span class="c">1 個</span></div>
    <div class="cards">
      <button class="card" data-game="psyc4-m0">
        <div class="ic">🧠</div><div class="ct">Module 0 腦研究方法道場</div>
        <div class="cd">Chapter 1 的 47 個術語 ＋ 20 題自測，中英並存：每張卡背面都有 Keller 的英文原句 ＋ 中文對照，單字和定義都能點喇叭聽。總覽、閃卡、自測三種模式，資料全部來自 Keller 的 Canvas 原頁面。</div>
        <div class="tagrow"><span class="tag">Ch.1</span><span class="tag">47 術語</span><span class="tag">20 題</span><span class="tag">🔊 發音</span></div>
        <div class="go">進去複習 →</div>
      </button>
    </div>
  </section>

  <div class="foot">把這頁加到手機主畫面或電腦書籤，之後點一下就能練。<br>每個遊戲各自獨立，進度分開存。</div>
</div>

  <div class="bar"><span class="back" id="back">← 回選單</span><span class="now" id="now"></span></div>

</div>

const TITLES = {"critique":"🔎 批判文道場","policy":"⚖️ 政策主張道場","psyc-hub":"📚 心智闖關學習中心","psyc-schedule":"🗓️ 心智闖關之旅（讀書排程）","psyc4-m0":"🧠 Module 0 腦研究方法道場"};
function b64ToUtf8(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(bytes);}
const $=s=>document.querySelector(s);
const menu=$("#menu"),player=$("#player"),frame=$("#frame"),now=$("#now");
function openGame(id){
  if(!GAMES[id])return;
  now.textContent=TITLES[id]||"";
  frame.srcdoc=b64ToUtf8(GAMES[id]);
  player.classList.add("show");document.body.style.overflow="hidden";
  if(location.hash!=="#"+id)history.pushState({id},"","#"+id);
  frame.focus();
}
function backToMenu(){player.classList.remove("show");frame.srcdoc="";now.textContent="";document.body.style.overflow="";}
document.querySelectorAll(".card").forEach(b=>b.addEventListener("click",()=>openGame(b.dataset.game)));
$("#back").addEventListener("click",()=>history.back());
window.addEventListener("popstate",()=>{const id=(location.hash||"").replace("#","");if(id&&GAMES[id])openGame(id);else backToMenu();});
(function(){const id=(location.hash||"").replace("#","");if(id&&GAMES[id])openGame(id);})();
</script>
