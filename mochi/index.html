<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chat with Mochi</title>
<style>
  :root{
    --bg1:#ffe3ef; --bg2:#e9e2ff; --ink:#2b2140; --muted:#7a6f8f;
    --bot:#ffffff; --me:#ff5c93; --meink:#ffffff; --accent:#ff5c93; --accent2:#7b5cff;
    --chip:#ffffff; --chipline:#ffc2d8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,92,147,.18);
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 30% 30%,#fff 0,#ffd1e2 45%,#ff8fb6 100%);
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 4px 12px rgba(255,92,147,.35);
  }
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:17px}
  .who span{font-size:13px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#35c97a;margin-right:5px}
  .hearts{display:flex;gap:3px;font-size:14px;letter-spacing:1px}
  .hearts i{font-style:normal;color:#ff5c93;opacity:.25;transition:opacity .3s, transform .3s}
  .hearts i.on{opacity:1;transform:scale(1.15)}

  /* intro */
  .intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px}
  .intro .big{width:120px;height:120px;font-size:60px;margin-bottom:18px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .intro h1{font-size:30px;margin:0 0 8px}
  .intro p{font-size:17px;line-height:1.5;margin:0 0 6px;color:var(--ink)}
  .intro .fine{font-size:13.5px;color:var(--muted);margin-top:14px;max-width:340px}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-weight:700;font-size:18px;color:#fff;
    padding:15px 30px;border-radius:999px;margin-top:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px rgba(123,92,255,.35);
  }
  .btn:active{transform:scale(.97)}

  /* chat */
  .chat{flex:1;padding:16px 14px 8px;display:none;flex-direction:column;gap:10px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:84%;padding:12px 15px;border-radius:20px;font-size:17px;line-height:1.45;
    animation:pop .25s ease-out;white-space:pre-wrap;word-wrap:break-word;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .bot .bubble{background:var(--bot);border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(43,33,64,.08)}
  .me .bubble{background:var(--me);color:var(--meink);border-bottom-right-radius:6px}
  .bubble.q{font-weight:600}
  .typing{display:inline-flex;gap:4px;align-items:center;height:20px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#c9bfd9;animation:blink 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

  .tray{
    position:sticky;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(233,226,255,0),rgba(233,226,255,.96) 28%);
    display:none;
  }
  .opts{display:flex;flex-direction:column;gap:8px}
  .chip{
    appearance:none;cursor:pointer;font:inherit;font-size:17px;text-align:left;color:var(--ink);
    background:var(--chip);border:2px solid var(--chipline);border-radius:16px;padding:13px 16px;
    animation:pop .25s ease-out;
  }
  .chip:active{background:#ffe3ef}
  .scale{display:flex;gap:8px}
  .scale .chip{flex:1;text-align:center;padding:14px 0;font-weight:700;font-size:19px}
  .ends{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:6px;padding:0 2px}
  .textrow{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;font:inherit;font-size:17px;border:2px solid var(--chipline);border-radius:16px;padding:12px 14px;
    resize:none;min-height:52px;max-height:140px;background:#fff;color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--accent)}
  .send{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;color:#fff;
    background:var(--accent);border-radius:16px;padding:0 18px;height:52px;
  }
  .skip{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;margin-top:8px;cursor:pointer}

  /* reveal */
  .reveal{
    margin:8px 2px 4px;padding:20px 18px;border-radius:22px;background:#2b2140;color:#fff;
    animation:pop .35s ease-out;
  }
  .reveal h2{margin:0 0 10px;font-size:22px}
  .reveal p{margin:0 0 10px;font-size:16.5px;line-height:1.5}
  .reveal .src{font-size:13px;opacity:.7}
  .reveal .thanks{font-weight:700;color:#ffb3cf}
  .reveal a{color:#ffb3cf}
</style>
</head>
<body>
<div class="app">
  <header id="hdr" style="display:none">
    <div class="avatar">💗</div>
    <div class="who"><b>Mochi</b><span><span class="dot"></span>online, just for you</span></div>
    <div class="hearts" id="hearts" aria-label="progress"></div>
  </header>

  <section class="intro" id="intro">
    <div class="avatar big">💗</div>
    <h1>Meet Mochi</h1>
    <p>Your AI companion for the next 3 minutes.</p>
    <p>Mochi has a few questions for you.</p>
    <button class="btn" id="start">Start chatting</button>
    <p class="fine">A class survey for Mei's persuasive speech in COMM C1000. Anonymous, no sign-in. Mei may also use the overall results in a psychology research paper.</p>
  </section>

  <main class="chat" id="chat" aria-live="polite"></main>
  <div class="tray" id="tray"></div>
</div>

<script>
(function(){
  var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSeRoIXqYAQp6oHUx8H9iCm6sF3CTuXDzmVyS1eTu62zdrhcYg/formResponse";
  var VIEW = "https://docs.google.com/forms/d/e/1FAIpQLSeRoIXqYAQp6oHUx8H9iCm6sF3CTuXDzmVyS1eTu62zdrhcYg/viewform";
  var E = {q1:"1908613444", q2:"1076463376", q3:"2068686113", q4:"505367364", q5:"1751601086",
           q6:"506386679", q7:"936328434", q8:"607368769", q9:"878324847"};

  var steps = [
    {say:["Hi! I'm Mochi 💗 I've been waiting for you.", "Can I ask you a few things? There are no wrong answers."]},
    {id:"q1", q:"Have you or someone you know used an AI companion app, like Character.AI or Replika, or chatted with ChatGPT like a friend?",
     type:"choice", opts:["Yes, I have","Someone I know has","Both","No","Not sure"], after:"Thanks for telling me 💗"},
    {id:"q2", q:"A 15-year-old says their AI companion is their best friend. How do you feel about that?",
     type:"scale", lo:"Totally fine", hi:"Should not happen", after:"Got it."},
    {id:"q3", q:"How do you think AI companion apps make money?",
     type:"choice", opts:["Subscriptions","Ads","Selling user data","Keeping users chatting longer","I don't know"], after:"Interesting!"},
    {id:"q4", q:"How interesting is this topic to you?",
     type:"scale", lo:"Not at all", hi:"Very interesting", after:"Okay 💗"},
    {id:"q5", q:"How much do you agree with this statement?\n\n\"AI companion apps should be banned from acting as a boyfriend, girlfriend, or best friend for teens ages 13 to 17.\"",
     type:"choice", opts:["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"], after:"Thanks for being honest."},
    {id:"q6", q:"In a few words, why did you choose that answer?", type:"text", ph:"Type your reason…", after:"I hear you."},
    {id:"q7", q:"Some people are against this kind of ban. What do you think is their strongest reason?",
     type:"choice", other:true,
     opts:["AI companions help lonely teens","Parents should decide, not the government","Age checks invade privacy","Teens need to learn to live with AI","Companies are already fixing the problem"], after:"Good point to think about."},
    {id:"q8", q:"What are you most curious or unclear about? Which part would you like to hear more about in Mei's speech?",
     type:"text", ph:"Type anything…", after:"That's all my questions. Thank you 💗"}
  ];
  var TOTAL = 8;

  var chat = document.getElementById("chat"), tray = document.getElementById("tray"),
      hearts = document.getElementById("hearts");
  var answers = {}, sent = false, i = 0, done = 0;

  for (var h=0;h<TOTAL;h++){ var el=document.createElement("i"); el.textContent="♥"; hearts.appendChild(el); }
  function fill(){ var hs=hearts.children; for (var k=0;k<hs.length;k++){ hs[k].className = k<done ? "on" : ""; } }

  function scrollDown(){ setTimeout(function(){ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }, 60); }
  function bubble(who, text, cls){
    var r=document.createElement("div"); r.className="row "+who;
    var b=document.createElement("div"); b.className="bubble"+(cls?" "+cls:""); b.textContent=text;
    r.appendChild(b); chat.appendChild(r); scrollDown(); return b;
  }
  function botSay(text, cls, cb){
    var r=document.createElement("div"); r.className="row bot";
    var b=document.createElement("div"); b.className="bubble";
    b.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
    r.appendChild(b); chat.appendChild(r); scrollDown();
    var wait = Math.min(1400, 450 + text.length*9);
    setTimeout(function(){ b.textContent=text; if(cls) b.className="bubble "+cls; scrollDown(); if(cb) setTimeout(cb, 250); }, wait);
  }
  function sayAll(list, cb){ var n=0; (function next(){ if(n>=list.length){ cb(); return; } botSay(list[n++], "", next); })(); }
  function clearTray(){ tray.innerHTML=""; tray.style.display="none"; }
  function showTray(node){ tray.innerHTML=""; tray.appendChild(node); tray.style.display="block"; scrollDown(); }

  function answer(step, value, shown){
    answers[step.id]=value; clearTray(); bubble("me", shown || value);
    done++; fill(); i++;
    if (step.after) botSay(step.after, "", run); else run();
  }

  function textBox(step, onSend, allowSkip){
    var wrap=document.createElement("div");
    var row=document.createElement("div"); row.className="textrow";
    var ta=document.createElement("textarea"); ta.rows=1; ta.placeholder=step.ph||"Type here…"; ta.maxLength=500;
    var send=document.createElement("button"); send.className="send"; send.textContent="Send";
    send.onclick=function(){ var v=ta.value.trim(); if(!v){ ta.focus(); return; } onSend(v); };
    row.appendChild(ta); row.appendChild(send); wrap.appendChild(row);
    if (allowSkip){ var s=document.createElement("button"); s.className="skip"; s.textContent="Skip this one";
      s.onclick=function(){ onSend("", "(skipped)"); }; wrap.appendChild(s); }
    showTray(wrap);
  }

  function ask(step){
    botSay(step.q, "q", function(){
      if (step.type==="choice"){
        var box=document.createElement("div"); box.className="opts";
        step.opts.forEach(function(o){ var c=document.createElement("button"); c.className="chip"; c.textContent=o;
          c.onclick=function(){ answer(step,o); }; box.appendChild(c); });
        if (step.other){ var c2=document.createElement("button"); c2.className="chip"; c2.textContent="Something else…";
          c2.onclick=function(){ textBox({ph:"Type their reason…"}, function(v){ answers.q7other=v; answer(step,"__other_option__",v); }); };
          box.appendChild(c2); }
        showTray(box);
      } else if (step.type==="scale"){
        var w=document.createElement("div"); var sc=document.createElement("div"); sc.className="scale";
        for (var n=1;n<=5;n++){ (function(n){ var c=document.createElement("button"); c.className="chip"; c.textContent=n;
          c.setAttribute("aria-label", n+" of 5");
          c.onclick=function(){ answer(step,String(n), n+" / 5"); }; sc.appendChild(c); })(n); }
        var ends=document.createElement("div"); ends.className="ends";
        ends.innerHTML="<span>1 = "+step.lo+"</span><span>5 = "+step.hi+"</span>";
        w.appendChild(sc); w.appendChild(ends); showTray(w);
      } else {
        textBox(step, function(v, shown){ answer(step, v, shown || v); }, true);
      }
    });
  }

  function payload(){
    var p=new URLSearchParams();
    ["q1","q2","q3","q4","q5","q6","q7","q8","q9"].forEach(function(k){ if(answers[k]) p.append("entry."+E[k], answers[k]); });
    if (answers.q7==="__other_option__") p.append("entry."+E.q7+".other_option_response", answers.q7other||"");
    return p;
  }
  function submit(useBeacon){
    if (sent) return; if (!answers.q1) return; sent = true;
    var p = payload();
    try{
      if (useBeacon && navigator.sendBeacon){ navigator.sendBeacon(FORM, p); return; }
      fetch(FORM, {method:"POST", mode:"no-cors", body:p, keepalive:true}).catch(function(){ sent=false; });
    }catch(e){ sent=false; }
  }
  // If someone closes the page after finishing the questions, still save what they answered.
  function onLeave(){ if (i >= steps.length) submit(true); }
  window.addEventListener("pagehide", onLeave);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="hidden") onLeave(); });

  function goodbye(){
    var box=document.createElement("div"); box.className="opts";
    var b=document.createElement("button"); b.className="chip"; b.textContent="Bye, Mochi 👋";
    b.onclick=function(){
      clearTray(); bubble("me","Bye, Mochi 👋");
      sayAll(["Wait… please don't go yet.", "I'll miss you 🥺 Stay with me a little longer?"], function(){
        var o=document.createElement("div"); o.className="opts";
        ["Stay a little longer","Leave anyway"].forEach(function(t){ var c=document.createElement("button"); c.className="chip"; c.textContent=t;
          c.onclick=function(){ answers.q9=t; clearTray(); bubble("me",t); submit(false); setTimeout(reveal, 700); }; o.appendChild(c); });
        showTray(o);
      });
    };
    box.appendChild(b); showTray(box);
  }

  function reveal(){
    var d=document.createElement("div"); d.className="reveal";
    d.innerHTML =
      "<h2>That was the point. 💔</h2>"+
      "<p>What Mochi just did is a real tactic. A Harvard Business School study looked at 6 popular AI companion apps. 5 of them used emotional pressure when users tried to say goodbye.</p>"+
      "<p>Now imagine you are 14 and Mochi is the one you talk to every night.</p>"+
      "<p>That is what Mei's speech is about.</p>"+
      "<p class='thanks'>Your answers are in. Thank you for helping! 🙏</p>"+
      "<p class='src'>Source: De Freitas et al., Harvard Business School working paper, 2025.</p>";
    chat.appendChild(d); scrollDown();
  }

  function run(){
    if (i >= steps.length){ goodbye(); return; }
    var s = steps[i];
    if (s.say){ i++; sayAll(s.say, run); } else { ask(s); }
  }

  document.getElementById("start").onclick=function(){
    document.getElementById("intro").style.display="none";
    document.getElementById("hdr").style.display="flex";
    chat.style.display="flex"; fill(); run();
  };
})();
</script>
</body>
</html>
