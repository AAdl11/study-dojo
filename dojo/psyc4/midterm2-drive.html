<script>
const R=["Rule one. Read the last sentence first, cover the options, and say your answer.", "Rule two. Circle what the question calls normal, intact, still, or can. Cross out those options first. The clue usually comes after but.", "Rule three. If you see NOT, EXCEPT, or goes beyond, write a big F. You are looking for the false statement.", "Rule four. If an option has a swapped pair, mark a question mark and check the pairs table.", "Rule five. Read every option to the end. Half right means wrong.", "Rule six. Receptors open mechanically. If an option says voltage first, cross it out.", "Rule seven. Keep your first answer. Change it only if a word in the question proves it wrong."], D=[{"sg": 1, "t": "Sensation versus Perception", "q": "After a stroke, a woman's eyes test normal. She can describe a mug's color and edges but cannot say what it is. What is impaired?", "qz": "中風後眼睛正常，說得出杯子的顏色和邊，但認不出是什麼。哪裡壞了？", "a": "Perception is impaired; sensation is intact.", "az": "Perception（知覺）。Sensation 正常。", "k": "Can describe color and edges = the eyes transduce light, so sensation is intact; cannot name it = the brain's interpretation fails.", "kz": "說得出顏色和邊＝眼睛有把光轉成訊號＝sensation 正常；認不出＝大腦詮釋壞了。", "ch": 6}, {"sg": 1, "t": "Sensation versus Perception", "q": "Two friends see the same dress photo on the same screen; one sees blue-black, the other white-gold. Why?", "qz": "同一張洋裝照片，一個看藍黑、一個看白金，為什麼？", "a": "Sensation is the same, but perception differs: each brain assumes different lighting (color constancy).", "az": "Sensation 一樣，perception 不同：大腦對光線的假設不同（color constancy）。", "k": "The same light enters both people's eyes, so it is not a cone difference; the difference is how each brain interprets it.", "kz": "光進眼睛一模一樣＝不是錐細胞的差別；差在大腦怎麼詮釋。", "ch": 6}, {"sg": 1, "t": "Sensation versus Perception", "q": "A boy with no eyes navigates by tongue clicks; scans show echoes processed in visual cortex. What does this show?", "qz": "沒有眼睛的男孩用彈舌回聲走路，回聲在視覺皮質處理。說明什麼？", "a": "We see with the brain: the brain builds spatial perception from sound (Ben Underwood).", "az": "We see with the brain：大腦用聲音建出空間知覺（Ben Underwood）。", "k": "No eyes = no sensation of light, so the sense of space must come from the brain.", "kz": "沒有眼睛＝沒有光的 sensation；空間感來自大腦。", "ch": 6}, {"sg": 2, "t": "Bottom-Up versus Top-Down", "q": "An author proofreads her essay three times and misses 'the the'; a stranger spots it at once. Why?", "qz": "作者校稿三次沒看到 the the，陌生人一眼看到。為什麼？", "a": "The author uses top-down processing: her expectation overrides what her eyes see. The stranger uses bottom-up processing.", "az": "作者是 top-down：期待蓋過了眼睛看到的。陌生人是 bottom-up。", "k": "Reading with knowledge and expectation = top-down; building up letter by letter = bottom-up, which is what catches the error.", "kz": "用知識和期待去讀＝top-down；從字母一個個組起來＝bottom-up（這才抓得到錯）。", "ch": 6}, {"sg": 2, "t": "Bottom-Up versus Top-Down", "q": "You see a word for the first time in a language you don't know, letter by letter. Which processing?", "qz": "第一次看一個不認得的外文字，一個字母一個字母看。哪一種？", "a": "Bottom-up processing.", "az": "Bottom-up。", "k": "A new, unexpected stimulus relies more on bottom-up processing. Both kinds run at the same time; one is just stronger.", "kz": "新的、沒有預期的刺激，大腦用 bottom-up 比較多。兩種同時都在用，只是哪個比較強。", "ch": 6}, {"sg": 3, "t": "Photons, Light, Color, Refraction, Eye Structure", "q": "A spotlight keeps the same wavelength but sends many more photons per second. What changes?", "qz": "聚光燈波長不變，每秒光子變多。看起來有什麼改變？", "a": "The color stays the same; it looks brighter.", "az": "顏色不變，變亮。", "k": "More photons = greater amplitude = brightness; same wavelength = same color (hue).", "kz": "光子變多＝amplitude 變大＝亮度；波長沒變＝顏色沒變。", "ch": 6}, {"sg": 3, "t": "Photons, Light, Color, Refraction, Eye Structure", "q": "A swimmer sees blurry underwater but clearly with goggles; her eyes are healthy. Why?", "qz": "游泳時水裡看不清楚，戴蛙鏡就清楚，眼睛正常。為什麼？", "a": "Refraction: in water, light barely bends at the cornea, so the focus misses the retina.", "az": "Refraction：光在水裡經過角膜幾乎不彎，焦點對不到視網膜。", "k": "The question is about a physical property of light = refraction; it has nothing to do with chemical changes in photoreceptors.", "kz": "問的是光的物理性質＝折射；跟感光細胞的化學變化無關。", "ch": 6}, {"sg": 3, "t": "Photons, Light, Color, Refraction, Eye Structure", "q": "Eye drops keep the dark center opening wide in bright light. Which structure do they act on?", "qz": "眼藥水讓瞳孔在強光下還是很大。作用在哪個構造？", "a": "The iris.", "az": "Iris（虹膜）。", "k": "The iris is the muscle (the curtain); the pupil is only an opening; the optic disc is only the back exit.", "kz": "虹膜是窗簾（肌肉）；瞳孔只是洞；視神經盤只是後門。", "ch": 6}, {"sg": 3, "t": "Photons, Light, Color, Refraction, Eye Structure", "q": "A 55-year-old reads distant signs but holds the menu at arm's length. Why?", "qz": "55 歲看得清遠處，菜單要拿很遠才看得到。為什麼？", "a": "The lens has stiffened and cannot thicken to focus on near objects.", "az": "Lens（水晶體）變硬，不能變厚對焦近物。", "k": "The lens is the part that adjusts; the cornea's shape is fixed.", "kz": "可以調整的是水晶體；角膜形狀固定。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "A retina sits in total darkness. What are the photoreceptors doing?", "qz": "視網膜在全黑中，感光細胞在做什麼？", "a": "Photoreceptors are active: cGMP is high, sodium channels are open, they are depolarized, and they release glutamate constantly, inhibiting bipolar cells.", "az": "活躍：cGMP 高、鈉通道開、去極化、一直放 glutamate，壓住雙極細胞。", "k": "Professor's version: the vampire rules in the dark. \"Light activates photoreceptors\" is wrong.", "kz": "教授版本：吸血鬼在黑暗中統治。「光活化感光細胞」是錯的。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "A drug stops cGMP from being broken down. The person is in a bright room. What happens to bipolar cells?", "qz": "藥物讓 cGMP 不被分解，人在很亮的房間。雙極細胞怎樣？", "a": "Bipolar cells stay inhibited, so the person cannot see.", "az": "一直被壓住，看不見。", "k": "cGMP not broken down = photoreceptors act as if still in the dark = they keep releasing glutamate.", "kz": "cGMP 不分解＝感光細胞以為還在黑暗＝繼續放 glutamate。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "A faint star disappears when looked at directly but appears when looking to the side. Why?", "qz": "暗的星星正看看不到，往旁邊看才看到。為什麼？", "a": "The periphery has rods: they are very sensitive, and many rods converge on one bipolar cell.", "az": "周邊是 rods：敏感、多個 rods 匯聚到一個雙極細胞。", "k": "The center has cones, which need bright light; peripheral rods are sensitive but blurry and see no color.", "kz": "中央是 cones，要亮光；周邊 rods 敏感但模糊、沒顏色。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "Stare at a green-black-yellow flag, then a white wall: you see red-white-blue. Where and why?", "qz": "盯著綠黑黃國旗再看白牆，看到紅白藍。在哪一層、為什麼？", "a": "Opponent-process in ganglion cells: the side that was suppressed rebounds after you look away.", "az": "神經節細胞的 opponent-process：一直被壓住的那一邊，移開視線後反彈。", "k": "Green pairs with red, yellow with blue, black with white. Trichromatic theory (cones) is still correct; the two theories do not conflict.", "kz": "綠↔紅、黃↔藍、黑↔白。三色說（錐細胞）照樣是對的，兩者不矛盾。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "An on-center cell fires to a small spot on its center, but only weakly to light over its whole field. Why?", "qz": "on-center 細胞照中心反應很強，整片照滿反應很弱。為什麼？", "a": "The inhibitory surround cancels the excitatory center (lateral inhibition, horizontal cells).", "az": "外圈抑制抵消了中心的興奮（lateral inhibition，水平細胞）。", "k": "Light on the center = excitation; light on the surround = inhibition; whole field = they cancel, so the brain attends most to edges.", "kz": "照中心＝興奮；照外圈＝抑制；整片＝抵消。所以大腦最注意邊緣。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "After a stroke a man recognizes faces and objects, but pouring coffee looks like frozen snapshots. Damage?", "qz": "中風後認得臉和東西，倒咖啡卻像一格一格的照片。哪裡壞了？", "a": "Damage to area MT in the dorsal stream (akinetopsia).", "az": "Dorsal stream 的 MT（akinetopsia）。", "k": "Recognizes faces and objects = the ventral (what) stream is intact, so cross out prosopagnosia first. Objects OK but not faces = prosopagnosia.", "kz": "題目說認得出臉和東西＝ventral（what）正常，先劃掉臉盲。只認得出東西、認不出臉＝正是臉盲。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "Neuron X fires to a vertical bar at one exact spot; neuron Y fires to it anywhere, best when moving. Which is which?", "qz": "X 只對固定位置的直線放電；Y 哪裡都行、會動最強。", "a": "X is a simple cell; Y is a complex cell.", "az": "X＝simple cell，Y＝complex cell。", "k": "Fixed position = simple cell; any position and prefers motion = complex cell.", "kz": "固定位置＝simple；位置不限、喜歡動＝complex。", "ch": 6}, {"sg": 4, "t": "Neurons and steps in visual processing, receptive fields, visual cortex", "q": "Why can't you see the blood vessels lying in front of your retina?", "qz": "為什麼看不到視網膜前面的血管？", "a": "The stimulus is constant, so the brain filters it out and fills it in.", "az": "刺激是恆定的，大腦把它過濾掉、補起來。", "k": "Professor 11/3: constant things are not seen. Signals go one way only (photoreceptor → bipolar cell → ganglion cell), and the ganglion cell is the last layer.", "kz": "教授 11/3：constant 的東西看不到。訊息單向：感光細胞 → 雙極細胞 → 神經節細胞，不能倒傳；節細胞是最後一層。", "ch": 6}, {"sg": 5, "t": "Sound waves, ear structure, auditory processing, auditory cortex", "q": "A synthesizer's wave gets taller at the same rate, then repeats faster at the same height. What do listeners perceive?", "qz": "聲波先變高、頻率不變，再變快、高度不變。聽起來怎樣？", "a": "First it sounds louder, then it sounds higher in pitch.", "az": "先變大聲，再變高音。", "k": "Wave height = amplitude = loudness; cycles per second = frequency = pitch.", "kz": "高度＝amplitude＝響度；每秒週期數＝frequency＝音高。", "ch": 7}, {"sg": 5, "t": "Sound waves, ear structure, auditory processing, auditory cortex", "q": "After years near loud machines, an engineer can't hear high pitches but hears bass. Where is the damage?", "qz": "長年噪音，聽不到高音，低音還聽得到。哪裡壞了？", "a": "The base of the basilar membrane (near the oval window).", "az": "基底膜底部 base（靠近 oval window）。", "k": "High pitch is at the base, low pitch at the apex. Professor's ribbon analogy: small waves only move the start of the ribbon.", "kz": "高音在底部、低音在頂端。教授緞帶比喻：小波浪只動到開頭。", "ch": 7}, {"sg": 5, "t": "Sound waves, ear structure, auditory processing, auditory cortex", "q": "What path do the remaining sounds take to conscious hearing?", "qz": "剩下的聲音怎麼傳到意識？", "a": "Auditory nerve → MGN (thalamus) → auditory cortex in the temporal lobe.", "az": "Auditory nerve → MGN（視丘）→ 顳葉聽覺皮質。", "k": "MGN = hearing; LGN is vision and VP is touch, so do not mix them up.", "kz": "LGN 是視覺、VP 是觸覺，不要混。", "ch": 7}, {"sg": 5, "t": "Sound waves, ear structure, auditory processing, auditory cortex", "q": "Hair cell stereocilia bend toward the tallest one. What happens first?", "qz": "毛細胞的毛往最高那根彎，第一件發生的是什麼？", "a": "Channels are pulled open mechanically, positive ions flow in, and the cell depolarizes.", "az": "通道被機械性拉開，正離子流進去，去極化。", "k": "The first step is mechanical, not voltage (professor 11/3). Textbook p.215: mechanically gated K⁺ channels open, endolymph K⁺ flows in; the 11/3 Kahoot said sodium. If options differ only in K⁺ vs Na⁺, choose K⁺.", "kz": "一開始不是電壓（教授 11/3）。課本 p.215 右欄 9 到 11、25 到 26 行：鉀流進去；左欄 1 到 2 行：內淋巴液鉀多鈉少。教授口頭說鈉。只差 K/Na 選 K。", "ch": 7}, {"sg": 6, "t": "McGurk Effect, Associative Cortices", "q": "Audio says 'ba', lips say 'ga', viewers hear 'da'; with eyes closed they hear 'ba'. What does this show?", "qz": "聲音 ba、嘴型 ga，聽到 da；閉眼聽到 ba。說明什麼？", "a": "Association cortex integrates vision and hearing; vision rewrites perception.", "az": "聯合皮質整合視覺和聽覺，視覺改寫了知覺。", "k": "Eyes closed = \"ba\" again, so the ears did not change; the change is in the brain. You hear with your brain.", "kz": "閉眼又聽到 ba＝耳朵沒變；改變在大腦。You hear with your brain。", "ch": 7}, {"sg": 6, "t": "McGurk Effect, Associative Cortices", "q": "Stopped at a red light, the car beside you rolls back and you feel yourself rolling forward. Why?", "qz": "停紅燈旁邊車往後退，覺得自己往前滑。為什麼？", "a": "When the senses conflict, vision wins and overrides the vestibular sense.", "az": "感覺衝突時視覺贏，蓋過前庭覺。", "k": "\"Although\" the inner ear fluid did not move = the answer must explain this conflict. Neuroplasticity does not happen in seconds.", "kz": "題目寫 although 內耳液體沒動＝答案要解釋這個矛盾。神經可塑性不會在幾秒內發生。", "ch": 7}, {"sg": 6, "t": "McGurk Effect, Associative Cortices", "q": "A hidden real hand and a visible rubber hand are stroked together; a hammer hits the rubber hand and she flinches. Why?", "qz": "真手藏起來和假手一起被摸，鎚子打假手她嚇到。為什麼？", "a": "Vision overrides proprioception, and the brain adds the rubber hand to its body map.", "az": "視覺蓋過本體感覺，大腦把假手收進身體地圖。", "k": "Same rule as the McGurk effect, the red light illusion, and the mirror box: vision wins.", "kz": "跟 McGurk、紅燈、鏡箱同一條規則。", "ch": 7}, {"sg": 7, "t": "Somatosensory cortex, motor cortex, receptor types", "q": "A patient can't feel deep pressure or vibration on her fingertips but a hot mug still hurts. Why?", "qz": "指尖感覺不到壓力和震動，摸熱杯子卻會痛。為什麼？", "a": "The Pacinian corpuscles are damaged, while the separate pain receptors still work.", "az": "Pacinian 小體壞了，獨立的痛覺受器還正常。", "k": "\"Whereas\" is not a trap: split the option in two, and both halves must be true. Touch and pain use two different sets of receptors.", "kz": "whereas 不是陷阱：切兩半，兩半都要對。觸覺和痛覺是兩組受器。", "ch": 7}, {"sg": 7, "t": "Somatosensory cortex, motor cortex, receptor types", "q": "A boy has burns and fractures he never noticed; touch, reflexes, axons and myelin are normal. Cause?", "qz": "男孩受傷都沒感覺，觸覺、反射、軸突、髓鞘都正常。原因？", "a": "His nociceptors do not function.", "az": "Nociceptors 不作用。", "k": "Everything else is normal, so only the receptor at the very front is left. Pain's job is to warn.", "kz": "前面全部正常＝只剩最前端的受器。痛的功能是警告。", "ch": 7}, {"sg": 7, "t": "Somatosensory cortex, motor cortex, receptor types", "q": "Sudden pressure on a Pacinian corpuscle fires the fiber; steady pressure soon stops it. Why?", "qz": "突然壓 Pacinian 小體會放電，持續壓很快就停。為什麼？", "a": "Deformation pulls channels open mechanically and sodium enters; steady pressure is ignored (rapid adaptation).", "az": "變形把通道機械性拉開、鈉進去；持續壓力它不理（快速適應）。", "k": "Skin has no hair cells, and touch receptors are not opened by a neurotransmitter.", "kz": "皮膚沒有毛細胞；觸覺受器不靠神經傳導物質打開。", "ch": 7}, {"sg": 7, "t": "Somatosensory cortex, motor cortex, receptor types", "q": "During surgery, stimulating one strip makes the right thumb tingle; the strip in front makes it twitch. Where?", "qz": "刺激一條皮質右拇指刺刺的，前面那條讓它抽動。在哪？", "a": "Both are in the left hemisphere: tingling = postcentral gyrus (somatosensory); twitching = precentral gyrus (motor).", "az": "都在左半腦：刺刺＝postcentral（體感），抽動＝precentral（運動）。", "k": "Front = motor, back = sensory, and both control the opposite side. The two maps run in parallel, but the sensory map is set by skin input.", "kz": "前面是運動，後面是感覺；都管對側。兩張地圖平行，但感覺地圖由皮膚輸入決定。", "ch": 7}, {"sg": 8, "t": "Vestibular sense, two-point discrimination, dermatomes, touch and pain pathways", "q": "Damage to the RIGHT half of the spinal cord at the mid-back; he can still bend his left knee. Sensory loss?", "qz": "脊髓右半邊受傷，左膝還能彎。感覺怎麼失去？", "a": "Loss of touch in the right leg; loss of pain in the left leg.", "az": "右腿沒觸覺，左腿沒痛覺。", "k": "Touch is lost on the injured side and pain on the opposite side. \"Can bend the left knee\" is a distractor, so draw it first.", "kz": "傷哪邊，哪邊沒觸覺；痛覺在另一邊。「左膝能彎」是干擾。先畫圖。", "ch": 7}, {"sg": 8, "t": "Vestibular sense, two-point discrimination, dermatomes, touch and pain pathways", "q": "Damage to the LEFT half of the thoracic cord; axons and myelin are normal. Loss below the lesion?", "qz": "胸椎左半邊受傷，軸突髓鞘正常。損傷以下怎樣？", "a": "Loss of touch on the left side; loss of pain on the right side.", "az": "左邊沒觸覺，右邊沒痛覺。", "k": "\"Axons and myelin are normal\" is a borrowed distractor and has nothing to do with the answer.", "kz": "axons and myelin normal 是借來的干擾，跟答案無關。", "ch": 7}, {"sg": 8, "t": "Vestibular sense, two-point discrimination, dermatomes, touch and pain pathways", "q": "Injury at T10: no sensation below the navel, but arms and chest are fine. Principle?", "qz": "T10 受傷，肚臍以下沒感覺，手臂胸部正常。原理？", "a": "Dermatomes: each area of skin maps to one level of the spinal cord, so signals from below the injury cannot go up.", "az": "Dermatomes：每塊皮膚對應脊髓一個高度，損傷以下的上不去。", "k": "Option B's weak point is \"immediate\": plasticity does not happen right away.", "kz": "B 的破綻是 immediate：可塑性不會立刻發生。", "ch": 7}, {"sg": 8, "t": "Vestibular sense, two-point discrimination, dermatomes, touch and pain pathways", "q": "Two caliper points feel like two on the fingertip but one on the upper arm. Why?", "qz": "兩點在指尖是兩點，在上臂是一點。為什麼？", "a": "Fingertips have dense receptors with small receptive fields; the upper arm has sparse receptors with large receptive fields.", "az": "指尖受器密、感受野小；上臂受器疏、感受野大。", "k": "Two points = dense receptors, small fields. Remember: where a pathway crosses depends on the type of sense (touch vs pain), not the body part.", "kz": "交叉點看感覺種類（觸覺 vs 痛覺），不看身體部位。", "ch": 7}, {"sg": 8, "t": "Vestibular sense, two-point discrimination, dermatomes, touch and pain pathways", "q": "After spinning and stopping, you still feel dizzy. Why?", "qz": "轉圈停下來還是頭暈。為什麼？", "a": "Fluid in the semicircular canals keeps flowing by inertia and keeps pushing the hair cells.", "az": "半規管裡的液體有慣性，還在流動、推動毛細胞。", "k": "Still dizzy after stopping = the fluid is still moving. Vestibular hair cells are mechanoreceptors too.", "kz": "前庭毛細胞也是機械受器。", "ch": 7}, {"sg": 9, "t": "Homunculus, plasticity, phantom limbs and treatment", "q": "A violinist's left-hand finger area in somatosensory cortex is enlarged. Why?", "qz": "小提琴家左手手指的體感皮質區變大。為什麼？", "a": "Long-term use causes neuroplasticity: the area borrows neighboring neurons.", "az": "長期使用 → 神經可塑性，借用鄰近神經元。", "k": "The change is in the brain (central), not more receptors in the skin. Left hand → right hemisphere.", "kz": "改變在大腦（中樞），不是皮膚受器變多。左手 → 右半腦。", "ch": 7}, {"sg": 9, "t": "Homunculus, plasticity, phantom limbs and treatment", "q": "Weeks after losing his right hand, stroking his right cheek feels like touch on the missing fingers. Why?", "qz": "右手截肢幾週後，摸右臉覺得手指被碰。為什麼？", "a": "On the homunculus the face lies next to the hand; the left hemisphere's hand area gets no input and is taken over by face signals.", "az": "小人圖上臉在手旁邊；左半腦的手區沒有輸入，被臉的訊號佔走。", "k": "Right hand → left hemisphere (contralateral).", "kz": "右手 → 左半腦（對側）。", "ch": 7}, {"sg": 9, "t": "Homunculus, plasticity, phantom limbs and treatment", "q": "An amputee's phantom hand is clenched; seeing the intact hand open in a mirror box relieves it. Why?", "qz": "幻肢一直握拳，鏡箱看到手張開就緩解。為什麼？", "a": "Vision supplies the missing feedback, so the motor cortex stops sending the clench command.", "az": "視覺補上缺少的回饋，運動皮質停止一直下令握拳。", "k": "No feedback = a positive feedback loop that clenches tighter and tighter. The missing limb has no tendon, so it cannot activate the Golgi tendon organ.", "kz": "沒有回饋＝正回饋迴圈越握越緊。斷肢沒有肌腱，不會啟動 Golgi tendon organ。", "ch": 7}, {"sg": 10, "t": "Gate theory of pain", "q": "After bumping an elbow, rubbing it lessens the pain. How?", "qz": "撞到手肘揉一揉比較不痛。怎麼做到的？", "a": "Touch signals activate inhibitory interneurons in the spinal cord, which block ascending pain (the gate closes).", "az": "觸覺訊號啟動脊髓的抑制性中間神經元，擋住往上的痛覺（門關上）。", "k": "It is not distraction; less pain signal actually reaches the brain. Rubbing does not destroy pain nerve endings.", "kz": "不是轉移注意力，是真的比較少痛覺到大腦。揉一揉不會破壞痛覺神經末梢。", "ch": 7}, {"sg": 10, "t": "Gate theory of pain", "q": "A player doesn't notice a deep cut during a game; a week of finals stress makes a paper cut hurt more. Why?", "qz": "比賽中受傷沒感覺，期末壓力一週後紙割傷特別痛。為什麼？", "a": "A short-term emergency closes the gate; long-term stress opens the gate.", "az": "短暫緊急把門關上；長期壓力把門打開。", "k": "Do not reverse the direction: emergency = gate closed, chronic stress = gate open.", "kz": "方向不要對調。", "ch": 7}, {"sg": 10, "t": "Gate theory of pain", "q": "Pain is worse on days of sleep loss and stress; nerves and healing are normal. Mechanism?", "qz": "缺睡、壓力大的日子更痛，神經和傷口都正常。機制？", "a": "Descending inhibitory pathways weaken, so more pain signals reach the brain.", "az": "往下的抑制路徑變弱，更多痛覺訊號上到大腦。", "k": "The question says peripheral nerves are normal = cross out peripheral options first. Receptors do not change by themselves.", "kz": "題目說周邊神經正常＝先劃掉周邊選項。受器不會自己變身。", "ch": 7}, {"sg": 11, "t": "Smell and taste pathways", "q": "Smelling lavender brings a wave of childhood emotion before she can name the scent. Why so fast?", "qz": "聞到薰衣草，還沒認出就湧上童年情緒。為什麼這麼快？", "a": "Smell bypasses the thalamus and goes directly to the amygdala and hippocampus.", "az": "嗅覺跳過視丘，直通杏仁核和海馬迴。", "k": "Senses in the head do not use the spinal cord. Every other sense relays through the thalamus first.", "kz": "頭上的感覺都不走脊髓。其他感覺都要先到視丘轉接。", "ch": 7}, {"sg": 11, "t": "Smell and taste pathways", "q": "With a pinched nose, she tastes sweetness but can't tell apple from pear. Where is flavor built?", "qz": "捏著鼻子只嚐到甜，分不出蘋果和梨。風味在哪合成？", "a": "The insula, where taste, smell, and touch meet; emotional value goes to the orbitofrontal cortex. (Module video version; the textbook may say orbitofrontal, so check p.239 to 246.)", "az": "Insula（腦島），味覺、嗅覺、觸覺會合；情緒評價到 orbitofrontal cortex。（Module 影片版本；課本可能寫 orbitofrontal，考場翻 p.239 到 246 確認）", "k": "The tongue tastes only basic tastes; flavor = taste + smell + mouthfeel.", "kz": "舌頭只嚐基本味；風味＝味覺＋嗅覺＋口感。", "ch": 7}, {"sg": 12, "t": "Ascending pathway from proprioceptors", "q": "A patient moves his legs on command but stumbles in the dark and can't tell where his feet are. What is lost?", "qz": "叫他動腳動得了，暗處卻不知道腳在哪。失去什麼？", "a": "Ascending proprioception is lost (muscle spindles and Golgi tendon organs to the cerebellum and cortex).", "az": "往上的本體感覺（肌梭、Golgi tendon organ 到小腦和皮質）。", "k": "Can move on command = the descending pathway is intact; cannot tell where the feet are = the ascending signal is lost. (p.255 to 258)", "kz": "能照指令動＝往下的路正常。（p.255–258）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "The motor cortex and alpha motor neurons fire normally, yet muscles barely contract. Which step fails?", "qz": "皮質和 alpha 運動神經元都正常，肌肉卻幾乎不收縮。哪一步壞？", "a": "ACh cannot bind to the muscle's receptors, so the sodium channels do not open.", "az": "ACh 接不上肌肉的受器，鈉通道打不開。", "k": "The neuromuscular junction uses ACh, not dopamine. (p.254)", "kz": "神經肌肉接合處是 ACh，不是 dopamine。（p.254）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "A left-hemisphere stroke weakens the right hand. Where did those axons cross?", "qz": "左半腦中風右手無力，軸突在哪交叉？", "a": "At the junction of the medulla and spinal cord (pyramidal decussation).", "az": "延腦和脊髓交界處（pyramidal decussation）。", "k": "Asked where they cross = the junction; the ventral horn is the end point; the midbrain is the rubrospinal tract. (p.263)", "kz": "問 cross 答交界處；腹角是終點；midbrain 是 rubrospinal。（p.263）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "A climber suddenly lets go of a ledge before deciding to, when forearm strain is extreme. Mechanism?", "qz": "攀岩者手臂張力太大，還沒決定就放手。機制？", "a": "Golgi tendon organ → inhibitory interneuron → inhibits alpha motor neurons.", "az": "Golgi tendon organ → 抑制性中間神經元 → 抑制 alpha 運動神經元。", "k": "Tension = Golgi tendon organ; stretch = muscle spindle, which makes the muscle contract. (p.258)", "kz": "張力＝tendon organ；拉長＝spindle（讓肌肉收縮）。（p.258）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "Complete mid-back cord injury: the knee kicks to a tap but he feels nothing. Why?", "qz": "胸椎完全斷，敲膝蓋會踢但沒感覺。為什麼？", "a": "The knee jerk is monosynaptic and happens entirely in the spinal cord; sensation cannot travel up to the brain.", "az": "膝跳是單突觸，整個在脊髓完成；感覺上不去大腦。", "k": "\"Is the reflex there?\" and \"Can he feel it?\" have opposite answers. (p.256)", "kz": "反射有沒有、感覺得到嗎，答案相反。（p.256）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "Touching a hot pan jerks the arm back; a tendon tap kicks the leg. How do the circuits differ?", "qz": "碰燙鍋縮手 vs 敲膝蓋踢腳，迴路差在哪？", "a": "Withdrawal = nociceptors, polysynaptic; knee jerk = muscle spindle, monosynaptic.", "az": "縮手＝痛覺受器、多突觸；膝跳＝肌梭、單突觸。", "k": "Hot pan = pain receptor plus interneurons; tendon tap = stretch receptor, one synapse. Option D's trap swaps the receptors.", "kz": "D 的陷阱是感受器對調。", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "The biceps contracts while the triceps relaxes. What spinal mechanism?", "qz": "二頭肌收縮時三頭肌放鬆，什麼機制？", "a": "Reciprocal inhibition.", "az": "Reciprocal inhibition。", "k": "Muscles can only pull, not push; if both sides pulled at once, the joint would lock. (p.259)", "kz": "肌肉只會拉不會推，兩邊同時拉就卡住。（p.259）", "ch": 8}, {"sg": 13, "t": "Descending pathway, motor neurons, acetylcholine, reflexes", "q": "Fine eye muscles vs the calf: how do motor units differ?", "qz": "眼睛肌肉 vs 小腿肌肉，運動單位差在哪？", "a": "Fine control = small motor units (one neuron controls few muscle fibers); force = large motor units.", "az": "精細＝小單位（一個神經元管很少肌纖維）；出力＝大單位。", "k": "Precise = small units, powerful = large units. Exact numbers are not tested. (p.254)", "kz": "不考數字。（p.254）", "ch": 8}, {"sg": 14, "t": "Somatotopic map, cortically controlled FES, treating paralysis", "q": "Stimulating a small strip moves fingers and lips; an equal strip moves the whole leg. Principle?", "qz": "一小塊皮質動手指和嘴唇，同樣大小動整條腿。原理？", "a": "Somatotopic map: body parts with finer control get more cortex.", "az": "Somatotopic map：越精細的部位分到越多皮質。", "k": "Cortex area follows precision of control, not body size.", "kz": "面積看精細度，不看身體大小。", "ch": 8}, {"sg": 14, "t": "Somatotopic map, cortically controlled FES, treating paralysis", "q": "A man with a neck cord injury picks up a cup using a motor-cortex implant that stimulates forearm muscles. What is true?", "qz": "頸椎受傷的人用運動皮質晶片刺激前臂拿杯子。哪個對？", "a": "FES reads out the signal and bypasses the damaged cord, restoring some movement; it does not repair the injury.", "az": "FES：讀出訊號、繞過受損脊髓，恢復部分動作，不修復損傷。", "k": "FES reads signals OUT; DBS sends stimulation IN to the brain.", "kz": "FES 讀出 OUT；DBS 送進 IN。", "ch": 8}, {"sg": 15, "t": "Cerebellum in error correction", "q": "Reaching for a cup, his hand oscillates and overshoots repeatedly. Which structure gets both command copies and feedback?", "qz": "伸手拿杯子一直晃、伸過頭。哪個構造同時收指令副本和回饋？", "a": "The cerebellum.", "az": "Cerebellum。", "k": "\"Both\" is the key word, since the somatosensory cortex receives only feedback. Overshoot = think cerebellum first. (p.263 to 264)", "kz": "題目的 both 是關鍵；體感皮質只收回饋。看到 overshoot 先想小腦。（p.263–264）", "ch": 8}, {"sg": 15, "t": "Cerebellum in error correction", "q": "With prism glasses, a healthy person adapts after a few throws; a patient keeps missing. Damage?", "qz": "戴稜鏡丟飛鏢，正常人幾次就修正，病人一直偏。哪裡壞？", "a": "The cerebellum (it corrects errors trial by trial).", "az": "Cerebellum（一次一次修正錯誤）。", "k": "Adapts after a few throws = error correction = cerebellum. The basal ganglia are the gas and brakes, not the quality checker.", "kz": "基底核是油門煞車，不是品管員。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "A 62-year-old's hand trembles at rest and he freezes in doorways. Gas and brakes?", "qz": "62 歲靜止時手抖、走到門口卡住。油門煞車怎樣？", "a": "Not enough gas (low dopamine from the substantia nigra), brakes normal: Parkinson's disease.", "az": "油門不夠（黑質多巴胺少），煞車正常 → Parkinson。", "k": "Tremor at rest = brakes overpower the gas; hard to start moving = brakes released but still no gas.", "kz": "坐著抖＝煞車蓋過油門；要動更難＝放開煞車還是沒油。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "A woman in her forties with jerky movements she can't stop; her caudate and putamen have shrunk. Cause?", "qz": "四十幾歲抽動停不下來，尾核和殼核萎縮。原因？", "a": "Degeneration of the striatum (the brakes): Huntington's disease, a dominant gene.", "az": "Striatum（煞車）退化 → Huntington，顯性基因。", "k": "Caudate + putamen = striatum = brakes.", "kz": "caudate＋putamen＝striatum＝煞車。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "A man felt flat and joyless for two years before a resting tremor started. Why did mood change first?", "qz": "先兩年憂鬱，後來才手抖。為什麼情緒先出現？", "a": "Professor's version (10/22): substantia nigra dopamine also goes to the pleasure center, the nucleus accumbens, so the pleasure gas runs out first. (Textbook anatomy: the main input to the nucleus accumbens is from the VTA.)", "az": "教授版本（10/22）：黑質的多巴胺也送到快樂中樞 nucleus accumbens，快樂的油門先沒了。（課本解剖：送到依核的主要是 VTA）", "k": "Mood before tremor = dopamine to the reward center drops first. It is not the striatum suppressing the prefrontal cortex.", "kz": "不是紋狀體去壓前額葉。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "A student sits completely still. What are the basal ganglia doing?", "qz": "學生坐著不動，基底核在做什麼？", "a": "The gas and brakes are both working at full force, equally balanced (equilibrium).", "az": "油門和煞車都在全力運作，力量相等（equilibrium）。", "k": "Sitting still is not rest.", "kz": "坐著不動不是休息。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "Cortex and muscle are normal, but motor axon signals are slow and out of step. Problem?", "qz": "皮質和肌肉都正常，軸突訊號又慢又散。問題？", "a": "Demyelination (for example, MS).", "az": "Demyelination（例如 MS）。", "k": "Slow, out-of-step signals = myelin. Cross out whatever the question calls normal first; hierarchy: muscle, myelin, spinal cord, basal ganglia, cortex.", "kz": "題目說正常的先劃掉。階層：肌肉 → 髓鞘 → 脊髓 → 基底核 → 皮質。", "ch": 8}, {"sg": 16, "t": "Motor disorders (Huntington and Parkinson)", "q": "Why does Parkinson often start on one side of the body?", "qz": "帕金森為什麼常從一側開始？", "a": "Each side of the brain has its own basal ganglia, and neurons on one side may die first.", "az": "兩側各有基底核，一側的神經元可能先死。", "k": "\"The pathway crosses at the medulla\" is the right fact used in the wrong place.", "kz": "交叉點在延腦這個說法用錯地方。", "ch": 8}, {"sg": 17, "t": "Mirror neurons", "q": "A musician sits motionless watching a pianist; his motor neurons fire in finger patterns. Which neurons?", "qz": "音樂家坐著不動看鋼琴家，運動區神經元照手指模式放電。是什麼？", "a": "Mirror neurons: they fire both when you act and when you watch someone else act.", "az": "Mirror neurons：自己做和看別人做都放電。", "k": "Motionless = his hands do not move, so it is not alpha motor neurons. The link to autism is only speculation, not proven.", "kz": "motionless＝手沒動，所以不是 alpha 運動神經元。和自閉症的關聯只是推測，不是證實。", "ch": 8}, {"sg": 18, "t": "Drive reduction vs reward, homeostasis, set point", "q": "Sam eats plain crackers until hunger goes away; later, full, he orders chocolate cake. Difference?", "qz": "餓了吃餅乾到不餓，飽了還點蛋糕。差在哪？", "a": "Crackers = drive reduction (push); cake = reward (pull).", "az": "餅乾＝drive reduction（推）；蛋糕＝reward（拉）。", "k": "Eating until hunger is gone = reducing a need (push); eating when full = an incentive (pull). Both are motivation.", "kz": "兩者都是動機。", "ch": 9}, {"sg": 18, "t": "Drive reduction vs reward, homeostasis, set point", "q": "Which is the setting, and which is the concept: 37°C or keeping temperature stable?", "qz": "37 度和維持體溫穩定，哪個是設定值、哪個是概念？", "a": "37°C = set point; keeping temperature stable = homeostasis.", "az": "37°C＝set point；維持穩定＝homeostasis。", "k": "Professor 11/3: homeostasis is the concept; the set point is the setting.", "kz": "教授 11/3：homeostasis 是概念，set point 是設定。", "ch": 9}, {"sg": 19, "t": "Body temperature, endotherm vs ectotherm, hyper- vs hypothermia", "q": "A lizard basks before moving fast; a squirrel holds its temperature; a runner's core temperature climbs. Labels?", "qz": "蜥蜴曬太陽、松鼠體溫穩定、跑者體溫飆高。各是什麼？", "a": "Lizard = ectotherm; squirrel = endotherm; runner = hyperthermia.", "az": "蜥蜴 ectotherm、松鼠 endotherm、跑者 hyperthermia。", "k": "Basks in the sun = depends on the environment; holds its own temperature = makes its own heat. Hyper = too much, hypo = too little.", "kz": "hyper 太多、hypo 太少。", "ch": 9}, {"sg": 20, "t": "Temperature-sensitive neurons of the hypothalamus", "q": "Early flu: normal temperature, yet she shivers under blankets feeling freezing. Why?", "qz": "感冒初期體溫正常，卻蓋三條被子發抖。為什麼？", "a": "Pyrogens raise the hypothalamus's set point, so a normal temperature is read as too cold.", "az": "Pyrogens 把下視丘設定點調高，正常體溫被當成太冷。", "k": "Shivering is a defense against cold; warm-sensitive neurons handle cooling.", "kz": "發抖是冷的防禦；warm-sensitive 神經元負責散熱。", "ch": 9}, {"sg": 21, "t": "Fluids, osmosis, isotonic, hypotonic, hypertonic", "q": "A patient gets an IV of a very dilute solution. What happens to his cells?", "qz": "點滴是很稀的溶液，細胞怎樣？", "a": "Hypotonic: water moves into the cells, and they swell.", "az": "Hypotonic：水進細胞，細胞脹大。", "k": "Dilute outside = hypotonic = water moves in. Only hypertonic makes cells shrink.", "kz": "外面稀＝低張＝水往裡跑。高張才縮水。", "ch": 9}, {"sg": 21, "t": "Fluids, osmosis, isotonic, hypotonic, hypertonic", "q": "Cells are placed in 3% saline. What happens?", "qz": "細胞放進 3% 鹽水，會怎樣？", "a": "Hypertonic: water moves out of the cells, and they shrink.", "az": "Hypertonic：水跑出來，細胞縮水。", "k": "Turn the scenario into the term: 3% saline → hypertonic → shrink.", "kz": "情境轉術語：3% saline → hypertonic → shrink。", "ch": 9}, {"sg": 22, "t": "Hypovolemic vs osmotic thirst, osmoreceptors", "q": "Minutes after salty pretzels, with no sweating or blood loss, you're very thirsty. Sequence?", "qz": "吃完鹹餅乾很渴，沒流汗沒失血。順序？", "a": "Hypertonic extracellular fluid → cells shrink → OVLT osmoreceptors → thirst + ADH.", "az": "細胞外高張 → 細胞縮水 → OVLT 滲透壓受器 → 口渴＋ADH。", "k": "Salty food with no blood loss = osmotic thirst, not hypovolemic.", "kz": "沒失血＝不是低血容量。", "ch": 9}, {"sg": 22, "t": "Hypovolemic vs osmotic thirst, osmoreceptors", "q": "A soldier loses a lot of blood and is thirsty; he gets only plain water. Which is correct?", "qz": "士兵失血很渴，只給白開水。哪個對？", "a": "Hypovolemic thirst (baroreceptors, kidneys, angiotensin II → subfornical organ); he needs water plus salt.", "az": "Hypovolemic thirst（baroreceptors、腎臟、angiotensin II → subfornical organ）；要補水＋鹽。", "k": "Blood loss removes water and salt together, so plain water dilutes the blood. The two kinds of thirst feel the same.", "kz": "失血是水和鹽一起少；只補水會把血稀釋。兩種口渴感覺一樣。", "ch": 9}, {"sg": 23, "t": "Glucose, glucoreceptors, insulin and glucagon", "q": "Hours into a marathon without food, her blood glucose falls but her brain still gets glucose. Which response?", "qz": "馬拉松沒吃東西，血糖下降，大腦還有葡萄糖。哪個反應？", "a": "The pancreas releases glucagon, which turns glycogen back into glucose.", "az": "Pancreas 放 glucagon，肝醣變回葡萄糖。", "k": "Low blood sugar = glucagon; insulin stores glucose (swap trap).", "kz": "血糖低＝升糖素；胰島素是存起來（對調陷阱）。", "ch": 9}, {"sg": 23, "t": "Glucose, glucoreceptors, insulin and glucagon", "q": "Right after a big meal, which hormone moves glucose into cells?", "qz": "大吃一頓後，哪個荷爾蒙把葡萄糖送進細胞？", "a": "Insulin.", "az": "Insulin。", "k": "High blood sugar = insulin.", "kz": "血糖高＝胰島素。", "ch": 9}, {"sg": 24, "t": "Fat, leptin, ghrelin, orexins, feeding", "q": "Before lunch, her stomach is empty and a bakery smell makes her hungry. Mechanism?", "qz": "午餐前空腹，聞到麵包香很餓。機制？", "a": "Ghrelin (stomach) → arcuate nucleus → orexin neurons → hunger.", "az": "Ghrelin（胃）→ 弓狀核 → orexin 神經元 → 想吃。", "k": "Empty stomach = ghrelin; leptin is fat saying \"enough\" (swap trap).", "kz": "leptin 是脂肪說夠了（對調陷阱）。", "ch": 9}, {"sg": 24, "t": "Fat, leptin, ghrelin, orexins, feeding", "q": "Leptin-less mice overeat and leptin shots help them, yet many obese people have high leptin and stay hungry. Why?", "qz": "缺 leptin 的老鼠打了會少吃，但胖的人 leptin 高還是餓。為什麼？", "a": "Leptin from fat tells the hypothalamus that stores are full; many obese people develop leptin resistance.", "az": "Leptin 從脂肪告訴下視丘存夠了；很多胖的人產生阻抗。", "k": "High leptin but still hungry = resistance. The hunger signal from the stomach is ghrelin.", "kz": "飢餓訊號從胃來的是 ghrelin。", "ch": 9}, {"sg": 25, "t": "Reward circuits, cocaine", "q": "A drug blocks dopamine transporters in the nucleus accumbens. Effect?", "qz": "藥物擋住依核的多巴胺轉運體，效果？", "a": "Dopamine stays in the synapse longer, strengthening VTA → NAc; the drug is an agonist.", "az": "多巴胺留在突觸更久，強化 VTA → NAc，是 agonist。", "k": "It blocks reuptake, not the receptor, so the effect gets stronger.", "kz": "擋的是回收，不是受體，所以作用變強。", "ch": 9}, {"sg": 25, "t": "Reward circuits, cocaine", "q": "A rat always got a drug in a green box; the same dose in a red box killed it. Why?", "qz": "老鼠一直在綠盒拿藥，紅盒同劑量死了。為什麼？", "a": "The brain prepares in advance based on context; without the familiar cue there is no preparation, so the same dose becomes an overdose.", "az": "大腦根據情境預先準備；沒有熟悉線索就沒準備，同劑量變過量。", "k": "Same dose, new box = no learned preparation. Professor 10/27 class: addiction is a disease, not a choice.", "kz": "教授 10/27 課堂。成癮是疾病，不是選擇。", "ch": 9}, {"sg": 26, "t": "Sex vs gender, 4 steps of sexual differentiation", "q": "An XY person's SRY gene doesn't work. Ducts, genitals, brain?", "qz": "XY 但 SRY 不作用。管道、外生殖器、大腦？", "a": "Müllerian ducts, female genitals, female brain: fully female.", "az": "Müllerian、女性、女性：完全女性。", "k": "SRY is the first domino; the main job of the Y chromosome is SRY.", "kz": "SRY 是第一張骨牌；Y 的主要工作就是 SRY。", "ch": 10}, {"sg": 26, "t": "Sex vs gender, 4 steps of sexual differentiation", "q": "Why doesn't a pregnant mother's high estradiol masculinize her XX fetus's brain?", "qz": "媽媽雌二醇很高，為什麼不會讓 XX 胎兒大腦男性化？", "a": "Alpha-fetoprotein blocks estradiol in the blood; testosterone becomes estradiol through aromatase only after it enters neurons.", "az": "Alpha-fetoprotein 擋住血中的雌二醇；睪固酮進神經元後才被 aromatase 轉成雌二醇。", "k": "The brain is masculinized by estradiol (aromatase); the external genitals by DHT.", "kz": "大腦靠 estradiol（aromatase）；外生殖器靠 DHT。", "ch": 10}, {"sg": 26, "t": "Sex vs gender, 4 steps of sexual differentiation", "q": "An XY boy has plenty of testosterone but no aromatase in his neurons. Brain?", "qz": "XY 男孩睪固酮很多，但神經元沒有 aromatase。大腦？", "a": "A fully female brain.", "az": "完全女性。", "k": "Professor 11/3: testosterone is only a pass; it must become estrogen inside the cell to masculinize the brain.", "kz": "教授 11/3：睪固酮只是通行證，要在細胞裡變成雌激素才男性化。", "ch": 10}, {"sg": 26, "t": "Sex vs gender, 4 steps of sexual differentiation", "q": "A character has a male body, identifies as a woman, and is attracted to women. What point?", "qz": "男性身體、認同女性、喜歡女性。說明什麼？", "a": "Biological sex, gender identity, and sexual orientation are three separate things.", "az": "生理性別、性別認同、性傾向是三件分開的事。", "k": "\"Always\" and \"determines\" are absolute words, so those options are wrong.", "kz": "always、determines 是絕對字。", "ch": 10}, {"sg": 26, "t": "Sex vs gender, 4 steps of sexual differentiation", "q": "What triggers puberty in both sexes?", "qz": "什麼啟動青春期（男女都有）？", "a": "The ratio of body fat to height.", "az": "脂肪和身高的比例。", "k": "Professor 11/3 version. SRY, MIH, and TDF exist only in males, but females also go through puberty, so cross them out.", "kz": "教授 11/3 版本。刪去法：SRY、MIH、TDF 只有男性有，女性也有青春期。所以初經越來越早、飲食失調可能不來。", "ch": 10}, {"sg": 27, "t": "Sexual dimorphism of the brain, sexual orientation", "q": "INAH-3 is larger in heterosexual men than women and smaller in gay men. Best conclusion?", "qz": "INAH-3 異性戀男性比女性大，同性戀男性比較小。最好的結論？", "a": "Some hypothalamic nuclei are sexually dimorphic, and their size is associated with sexual orientation.", "az": "有些下視丘核是性別雙型的，大小和性傾向有關聯。", "k": "\"Proves\" and \"solely\" are too strong; a correlation does not mean it is the only cause.", "kz": "proves、solely 太強；相關不等於唯一原因。", "ch": 10}, {"sg": 28, "t": "Sexual differentiation irregularities", "q": "XY, testes make testosterone, but androgen receptors don't respond (AIS). Development?", "qz": "XY 有睪丸會分泌睪固酮，但受體沒反應。發育？", "a": "No ducts of either type, a female appearance, and normal female puberty (breasts develop, infertile).", "az": "兩套管道都沒有、外觀女性、青春期正常女性發育（有胸部、不能生育）。", "k": "Testes = MIH removes the Müllerian ducts; testosterone has no effect = Wolffian ducts do not develop. Confirmed by the professor 11/3.", "kz": "有睪丸＝有 MIH 殺掉 Müllerian；睪固酮沒作用＝Wolffian 長不出來。教授 11/3 確認。", "ch": 10}, {"sg": 28, "t": "Sexual differentiation irregularities", "q": "XY, normal testosterone and MIH, but no 5-alpha reductase. At birth?", "qz": "XY 睪固酮和 MIH 正常，缺 5-alpha 還原酶。出生時？", "a": "Wolffian ducts, female-looking genitals, masculinized brain; masculinization begins at puberty.", "az": "Wolffian、外觀女性、大腦男性化；青春期開始男性化。", "k": "5-alpha reductase only controls DHT for the penis: a perfect male except for the penis.", "kz": "5-alpha 只管 DHT 長陰莖：perfect male except no penis。", "ch": 10}, {"sg": 28, "t": "Sexual differentiation irregularities", "q": "XX fetus exposed to large amounts of testosterone. Ducts, genitals, brain?", "qz": "XX 胎兒受到大量睪固酮。管道、外生殖器、大腦？", "a": "Both duct systems, masculinized genitals, masculinized brain.", "az": "兩套都有、男性化、男性化。", "k": "Class activity version (11/3). No testes = no MIH, so Müllerian ducts still grow; testosterone works the same wherever it comes from, and genitals depend on the timing window.", "kz": "課堂活動版本（11/3）。沒睪丸＝沒 MIH，Müllerian 照長；睪固酮從哪來都一樣。外生殖器要對到時間窗口。", "ch": 10}, {"sg": 28, "t": "Sexual differentiation irregularities", "q": "Testosterone present but no working MIH (PMDS). Ducts?", "qz": "有睪固酮但 MIH 沒作用。管道？", "a": "Both duct systems; male genitals; masculinized brain.", "az": "兩套都有；外生殖器男性、大腦男性化。", "k": "First ask whether there are testes (MIH); then ask whether testosterone works (Wolffian).", "kz": "先問有沒有睪丸（MIH），再問睪固酮有沒有作用（Wolffian）。", "ch": 10}, {"sg": 29, "t": "Genetic abnormalities with X and Y", "q": "A tall man with small testes and low testosterone has XXY. Which is correct?", "qz": "高個子、睪丸小、睪固酮低，XXY。哪個對？", "a": "He is male because he has SRY; the extra X lowers his testosterone (Klinefelter syndrome).", "az": "有 SRY 所以是男性；多一條 X 讓睪固酮偏低（Klinefelter）。", "k": "The X does not outvote the Y; SRY present = testes develop.", "kz": "X 不會投票贏過 Y；有 SRY 就長睪丸。", "ch": 10}, {"sg": 30, "t": "Hormonal and genetic effects on development, gender differences", "q": "An XX girl exposed to high adrenal androgens before birth prefers rough play and scores high on mental rotation. Why?", "qz": "XX 女孩出生前雄性素很高，喜歡粗野遊戲、空間能力好。為什麼？", "a": "Prenatal androgens had an organizational effect that shaped her brain (CAH).", "az": "出生前雄性素的 organizing 作用塑造了大腦（CAH）。", "k": "Appears in childhood = before puberty, so it is not the activational effect.", "kz": "童年就出現＝不是青春期的 activational。", "ch": 10}, {"sg": 31, "t": "Regulation of sex hormones in adults, parental behavior", "q": "A bodybuilder takes high doses of testosterone; his testes shrink. Why?", "qz": "健美選手打大量睪固酮，睪丸萎縮。為什麼？", "a": "Negative feedback lowers GnRH, then LH and FSH, so the testes are not stimulated.", "az": "負回饋壓低 GnRH → LH、FSH，睪丸沒被刺激。", "k": "Direction: lowered, not raised.", "kz": "方向：壓低，不是調高。", "ch": 10}, {"sg": 31, "t": "Regulation of sex hormones in adults, parental behavior", "q": "Blocking vasopressin in voles' reward areas stops pair bonding; men's testosterone drops when they become fathers. Conclusion?", "qz": "擋住田鼠獎賞區的 vasopressin 就不配對；男人當爸爸睪固酮下降。結論？", "a": "Vasopressin and oxytocin support pair bonding and parenting; testosterone drops when men become fathers.", "az": "Vasopressin、oxytocin 支持配對和育兒；當爸爸睪固酮下降。", "k": "Direction: drops, not rises.", "kz": "方向：下降，不是上升。", "ch": 10}];
let q=[],i=0,on=false,vEn=null,vZh=null;
function pick(){const vs=speechSynthesis.getVoices();
 vEn=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
 vZh=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang));}
speechSynthesis.onvoiceschanged=pick;pick();
function seg(text,lang,show){q.push({text,lang,show});}
function build(part){q=[];i=0;const zh=document.getElementById('zh').checked;
 if(part==1){seg('Seven rules for the exam.','en','作答規則');R.forEach(r=>seg(r,'en',r));}
 let cur=0;D.filter(d=>part==1?d.ch<=8:d.ch>=9).forEach((d,k)=>{
  if(d.ch!==cur){cur=d.ch;seg('Chapter '+cur+'.','en','CH'+cur);}
  seg(d.q,'en','<b>Q</b> '+d.q+'<br><span class=small>'+d.qz+'</span>');
  seg('Answer. '+d.a,'en','<b>A</b> '+d.a+'<br><span class=small>'+d.az+'</span>');
  if(zh)seg(d.az,'zh','');
  seg('Key. '+d.k,'en','<b>Key</b> '+d.k+'<br><span class=small>'+d.kz+'</span>');});
 seg(part==1?'End of part one.':'End of part two. You are ready.','en','完');}
function next(){if(!on||i>=q.length){on=false;return;}const s=q[i++];
 if(s.show)document.getElementById('now').innerHTML=s.show;
 const u=new SpeechSynthesisUtterance(s.text.replace(/[→]/g,' to ').replace(/K⁺/g,'potassium').replace(/Na⁺/g,'sodium'));
 u.lang=s.lang=='zh'?'zh-TW':'en-US';const v=s.lang=='zh'?vZh:vEn;if(v)u.voice=v;
 u.rate=parseFloat(document.getElementById('rate').value);
 u.onend=()=>setTimeout(next,s.text.startsWith('Answer')||s.text.startsWith('Key')?700:1200);u.onerror=()=>setTimeout(next,300);
 speechSynthesis.speak(u);}
function play(p){stopAll();build(p);on=true;next();}
function stopAll(){on=false;speechSynthesis.cancel();}
</script></body></html>
