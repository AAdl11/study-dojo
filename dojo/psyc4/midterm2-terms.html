<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSYC 4 期中二 Study Guide 單字</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F3EC;--ink:#26282D;--seal:#A63A2B;--mut:#6f6a5f;--card:#FFFFFF;--line:#E3DFD2;--ok:#2f7a4a;--okbg:#e4f2e8;--bad:#b23b2b;--badbg:#f8e5e1;--sel:#26282D;--selink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c1b19;--ink:#ece8de;--seal:#d0614f;--mut:#aaa498;--card:#26251f;--line:#3a382f;--ok:#6cc38b;--okbg:#1f3326;--bad:#e3826f;--badbg:#3a2420;--sel:#ece8de;--selink:#1c1b19}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.6;font-size:18px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:28px;letter-spacing:.04em}
h2{font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;margin:28px 0 12px}
.sub{color:var(--mut);font-size:15px;margin:6px 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.rules li{margin-left:20px;font-size:16px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;min-width:96px}
button{font:inherit;cursor:pointer}
.btn{font-size:16px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.btn.hot{background:var(--seal);border-color:var(--seal);color:#fff}
.prog{font-size:14px;color:var(--mut)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qn{font-weight:700;font-size:18px}
.marks{display:flex;gap:6px}
.mk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px}
.mk.on{background:var(--sel);color:var(--selink)}
.say{border:none;background:none;font-size:22px;padding:4px 8px}
.stem{font-size:18px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;font-size:17px;padding:12px 14px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.opt.on{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.exp{display:none;margin-top:10px;font-size:16px;border-top:1px dashed var(--line);padding-top:10px}
.exp p{margin:6px 0}
.exp .zh{font-weight:700}
.tag{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:40px}
.chip.on{background:var(--seal);border-color:var(--seal);color:#fff}
.done .exp{display:block}
.score{font-size:24px;font-weight:900;font-family:'Noto Serif TC',serif}
table{border-collapse:collapse;width:100%;font-size:16px;margin-top:8px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
textarea{width:100%;min-height:160px;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.voc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.voc .w{font-weight:700;font-size:18px}
.voc .s{font-size:15px;color:var(--mut)}
.voc .z{font-size:16px}
.voc .sp{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px}
.hide{display:none}
.back{display:inline-block;margin-top:24px;color:var(--mut);font-size:15px}

.sig{font-size:15px;color:var(--seal);margin-top:2px}
.en2{font-size:14px;color:var(--mut)}
.chh{font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;margin:22px 0 6px}
</style></head><body><div class="wrap">

<script>
const G=[{"n": 1, "t": "Sensation", "s": "sen-SAY-shun", "en": "receiving signals and turning them into neural signals", "zh": "感覺：收訊號", "sig": "眼睛、耳朵正常、收得到"}, {"n": 1, "t": "Perception", "s": "per-SEP-shun", "en": "the brain organizing and interpreting signals", "zh": "知覺：大腦詮釋", "sig": "收得到但認不出、兩個人看同一張圖看法不同"}, {"n": 2, "t": "Bottom-up processing", "s": "BOT-um UP", "en": "building meaning from small details", "zh": "由下而上", "sig": "第一次看到、沒有預期、一個字母一個字母讀"}, {"n": 2, "t": "Top-down processing", "s": "TOP DOWN", "en": "using knowledge and expectations", "zh": "由上而下", "sig": "期待、熟悉、沒看到錯字、刻板印象"}, {"n": 3, "t": "Photon", "s": "FOH-ton", "en": "a particle of light", "zh": "光子", "sig": "光子變多＝更亮"}, {"n": 3, "t": "Wavelength", "s": "WAVE-length", "en": "distance between waves; codes color", "zh": "波長", "sig": "顏色、紅光綠光、530 nm"}, {"n": 3, "t": "Amplitude", "s": "AM-plih-tood", "en": "height of the wave; codes brightness or loudness", "zh": "振幅", "sig": "更亮、更暗、更大聲、波變高"}, {"n": 3, "t": "Refraction", "s": "rih-FRAK-shun", "en": "bending of light", "zh": "折射", "sig": "水裡看不清、蛙鏡、角膜、對焦"}, {"n": 3, "t": "Cornea", "s": "KOR-nee-uh", "en": "clear front surface; does most bending", "zh": "角膜", "sig": "光從空氣進眼睛那一層"}, {"n": 3, "t": "Lens", "s": "LENZ", "en": "adjusts shape to focus near and far", "zh": "水晶體", "sig": "近看要變厚、老花"}, {"n": 3, "t": "Iris", "s": "EYE-ris", "en": "colored muscle that sets pupil size", "zh": "虹膜", "sig": "瞳孔變大變小、眼藥水"}, {"n": 3, "t": "Pupil", "s": "PYOO-pil", "en": "the opening; controls nothing", "zh": "瞳孔", "sig": "只是洞"}, {"n": 3, "t": "Fovea", "s": "FOH-vee-uh", "en": "center of retina, packed with cones", "zh": "中央小窩", "sig": "正對著看、最清楚、顏色"}, {"n": 3, "t": "Optic disc", "s": "OP-tik DISK", "en": "where axons leave; no receptors", "zh": "視神經盤", "sig": "盲點、點消失"}, {"n": 4, "t": "Rods", "s": "RODZ", "en": "sensitive, dim light, no color, periphery", "zh": "桿細胞", "sig": "暗處、眼角、星星往旁邊看"}, {"n": 4, "t": "Cones", "s": "KOHNZ", "en": "bright light, color, detail, fovea", "zh": "錐細胞", "sig": "顏色、細節、要亮"}, {"n": 4, "t": "Bipolar cells", "s": "by-POH-ler", "en": "middle layer; released when light arrives", "zh": "雙極細胞", "sig": "黑暗中被壓住、光來才發"}, {"n": 4, "t": "Ganglion cells", "s": "GANG-glee-on", "en": "last layer; first to fire action potentials; axons form optic nerve", "zh": "神經節細胞", "sig": "最後一層、拮抗配對、走出視神經盤"}, {"n": 4, "t": "Horizontal / amacrine cells", "s": "hor-ih-ZON-tul / AM-uh-krin", "en": "side connections; lateral inhibition", "zh": "水平／無軸突細胞", "sig": "側向連接、邊緣變清楚"}, {"n": 4, "t": "Glutamate (in the dark)", "s": "GLOO-tuh-mate", "en": "released by photoreceptors in the dark to inhibit bipolar cells", "zh": "麩胺酸", "sig": "黑暗中一直放、光來變少"}, {"n": 4, "t": "cGMP", "s": "see-jee-em-PEE", "en": "keeps sodium channels open in the dark; light breaks it down", "zh": "cGMP", "sig": "不被分解＝一直像黑暗"}, {"n": 4, "t": "Receptive field (center-surround)", "s": "ree-SEP-tiv FEELD", "en": "area a cell responds to; center excites, surround inhibits", "zh": "感受野", "sig": "照中心強、照外圈弱、整片抵消"}, {"n": 4, "t": "Lateral inhibition", "s": "LAT-er-al in-hih-BISH-un", "en": "neighbors inhibit each other to sharpen edges", "zh": "側向抑制", "sig": "邊緣、對比、Hermann grid"}, {"n": 4, "t": "Trichromatic theory", "s": "try-kroh-MAT-ik", "en": "three cone types mix colors", "zh": "三色說", "sig": "錐細胞、混色、紅＋綠＝黃"}, {"n": 4, "t": "Opponent-process theory", "s": "oh-POH-nent", "en": "red-green, blue-yellow pairs in ganglion cells", "zh": "拮抗說", "sig": "後像、盯久了看到相反色"}, {"n": 4, "t": "Simple / complex cells", "s": "SIM-pul / KOM-plex", "en": "V1 cells: fixed spot vs anywhere, likes motion", "zh": "簡單／複雜細胞", "sig": "固定位置 vs 哪裡都行會動"}, {"n": 4, "t": "Ventral stream", "s": "VEN-trul", "en": "to temporal lobe: WHAT (objects, faces)", "zh": "腹側路線", "sig": "認東西、認臉、臉盲"}, {"n": 4, "t": "Dorsal stream", "s": "DOR-sul", "en": "to parietal lobe: WHERE and motion (area MT)", "zh": "背側路線", "sig": "看不到動、像照片一格格"}, {"n": 4, "t": "Prosopagnosia", "s": "PROS-oh-pag-NOH-zhuh", "en": "face blindness: ventral stream damage; objects can still be recognized", "zh": "臉盲", "sig": "認得出東西、認不出臉；靠聲音或衣服認家人"}, {"n": 4, "t": "Akinetopsia", "s": "ay-kin-eh-TOP-see-uh", "en": "motion blindness: area MT damage in the dorsal stream", "zh": "動作盲", "sig": "倒咖啡看不到水位上升、像一格一格的照片"}, {"n": 5, "t": "Frequency", "s": "FREE-kwen-see", "en": "cycles per second; codes pitch", "zh": "頻率", "sig": "音高、每秒幾次"}, {"n": 5, "t": "Basilar membrane", "s": "BAZ-ih-ler", "en": "in cochlea; base = high pitch, apex = low pitch", "zh": "基底膜", "sig": "高音聽不到＝底部壞"}, {"n": 5, "t": "Hair cells / stereocilia", "s": "steer-ee-oh-SIL-ee-uh", "en": "mechanoreceptors; bending pulls channels open", "zh": "毛細胞／靜纖毛", "sig": "毛彎曲、機械性拉開、不是電壓"}, {"n": 5, "t": "Medial geniculate nucleus (MGN)", "s": "jeh-NIK-yoo-lit", "en": "thalamus relay for hearing", "zh": "內側膝狀核", "sig": "聽覺經視丘"}, {"n": 5, "t": "Auditory cortex", "s": "AW-dih-tor-ee", "en": "temporal lobe", "zh": "聽覺皮質", "sig": "顳葉"}, {"n": 6, "t": "McGurk effect", "s": "mik-GURK", "en": "seeing lips changes what you hear", "zh": "McGurk 效應", "sig": "聲音 ba 嘴型 ga 聽到 da、閉眼恢復"}, {"n": 6, "t": "Association cortex", "s": "uh-soh-see-AY-shun", "en": "areas that combine senses", "zh": "聯合皮質", "sig": "整合視覺和聽覺／觸覺"}, {"n": 7, "t": "Somatosensory cortex", "s": "soh-mat-oh-SEN-sor-ee", "en": "postcentral gyrus; receives touch", "zh": "體感皮質", "sig": "刺刺的、感覺、中央溝後面"}, {"n": 7, "t": "Motor cortex", "s": "MOH-ter", "en": "precentral gyrus; sends movement commands", "zh": "運動皮質", "sig": "抽動、下命令、中央溝前面"}, {"n": 7, "t": "Mechanoreceptors", "s": "meh-KAN-oh-ree-sep-terz", "en": "respond to pressure, vibration, stretch", "zh": "機械受器", "sig": "壓、震動、Pacinian、毛細胞"}, {"n": 7, "t": "Pacinian corpuscle", "s": "pah-SIN-ee-un KOR-pus-ul", "en": "onion-shaped; sudden pressure and vibration", "zh": "Pacinian 小體", "sig": "突然壓才有反應、持續壓不理"}, {"n": 7, "t": "Thermoreceptors", "s": "THER-moh-ree-sep-terz", "en": "respond to warm or cold", "zh": "溫度受器", "sig": "冷熱（不是痛）"}, {"n": 7, "t": "Nociceptors", "s": "NOH-sih-sep-terz", "en": "respond to damage, extreme heat, chemicals", "zh": "痛覺受器", "sig": "受傷沒感覺、軸突髓鞘正常卻不痛"}, {"n": 7, "t": "Proprioceptors", "s": "proh-pree-oh-SEP-terz", "en": "in muscles; length and tension", "zh": "本體感受器", "sig": "閉眼知道手在哪、不看不知道腳在哪"}, {"n": 8, "t": "Vestibular sense", "s": "ves-TIB-yoo-ler", "en": "balance; fluid in semicircular canals", "zh": "前庭覺", "sig": "轉圈頭暈、平衡"}, {"n": 8, "t": "Two-point discrimination", "s": "dis-krim-ih-NAY-shun", "en": "telling two touches apart", "zh": "兩點辨識", "sig": "指尖兩點、上臂一點"}, {"n": 8, "t": "Dermatome", "s": "DER-muh-tome", "en": "skin area served by one spinal level", "zh": "皮節", "sig": "某個高度以下沒感覺"}, {"n": 8, "t": "Dorsal column pathway", "s": "DOR-sul KOL-um", "en": "touch; same side, crosses in medulla", "zh": "觸覺路線", "sig": "同側失去觸覺"}, {"n": 8, "t": "Spinothalamic pathway", "s": "spy-noh-thuh-LAM-ik", "en": "pain; crosses right away in cord", "zh": "痛覺路線", "sig": "對側失去痛覺"}, {"n": 9, "t": "Homunculus", "s": "hoh-MUNK-yoo-lus", "en": "body map; hands, lips large; face next to hand", "zh": "小人圖", "sig": "面積看精細度、摸臉覺得手被碰"}, {"n": 9, "t": "Plasticity", "s": "plas-TIS-ih-tee", "en": "map changes with use; slow, not instant", "zh": "可塑性", "sig": "小提琴家、截肢後幾週（不是幾秒）"}, {"n": 9, "t": "Phantom limb pain", "s": "FAN-tum LIM", "en": "pain in a missing limb", "zh": "幻肢痛", "sig": "截肢、還在握拳"}, {"n": 9, "t": "Mirror box", "s": "MIR-er BOX", "en": "vision supplies the missing feedback", "zh": "鏡箱", "sig": "看到手張開就鬆開"}, {"n": 10, "t": "Gate theory", "s": "GATE", "en": "touch input closes a spinal gate on pain", "zh": "閘門理論", "sig": "揉一揉、壓力缺睡會更痛"}, {"n": 11, "t": "Olfactory bulb", "s": "ol-FAK-tor-ee", "en": "smell; skips thalamus, to amygdala and hippocampus", "zh": "嗅球", "sig": "聞到就想起往事"}, {"n": 11, "t": "Gustatory pathway", "s": "GUS-tuh-tor-ee", "en": "taste: medulla, thalamus, gustatory cortex", "zh": "味覺路線", "sig": "味覺經視丘"}, {"n": 11, "t": "Insula", "s": "IN-suh-luh", "en": "where taste, smell, touch combine into flavor", "zh": "腦島", "sig": "捏鼻子只剩甜"}, {"n": 12, "t": "Muscle spindle", "s": "SPIN-dul", "en": "detects stretch (length)", "zh": "肌梭", "sig": "膝跳、被拉長"}, {"n": 12, "t": "Golgi tendon organ", "s": "GOAL-jee TEN-dun", "en": "detects tension (force); relaxes muscle", "zh": "高爾基腱器", "sig": "太重放手、用力太大鬆開"}, {"n": 13, "t": "Alpha motor neuron", "s": "AL-fuh", "en": "in ventral horn; makes muscle contract", "zh": "alpha 運動神經元", "sig": "腹角、最後一條神經"}, {"n": 13, "t": "Acetylcholine (ACh)", "s": "uh-see-til-KOH-leen", "en": "neuromuscular junction transmitter", "zh": "乙醯膽鹼", "sig": "肌肉不收縮但神經正常"}, {"n": 13, "t": "Decussation", "s": "dek-uh-SAY-shun", "en": "crossing; corticospinal at medulla-cord junction", "zh": "交叉", "sig": "問在哪裡 cross"}, {"n": 13, "t": "Monosynaptic reflex", "s": "mon-oh-sih-NAP-tik", "en": "one synapse; knee jerk", "zh": "單突觸反射", "sig": "敲膝蓋"}, {"n": 13, "t": "Polysynaptic reflex", "s": "pol-ee-sih-NAP-tik", "en": "with interneurons; withdrawal", "zh": "多突觸反射", "sig": "碰燙縮手"}, {"n": 13, "t": "Reciprocal inhibition", "s": "rih-SIP-roh-kul", "en": "opposite muscle relaxes", "zh": "相互抑制", "sig": "二頭肌收、三頭肌鬆"}, {"n": 14, "t": "Somatotopic map", "s": "soh-mat-oh-TOP-ik", "en": "body map in motor cortex", "zh": "體部位地圖", "sig": "手指嘴唇佔很多"}, {"n": 14, "t": "FES", "s": "EF-EE-ES", "en": "reads cortex signals out, stimulates muscles, bypasses cord", "zh": "功能性電刺激", "sig": "四肢癱瘓靠晶片拿杯子"}, {"n": 15, "t": "Cerebellum", "s": "sair-uh-BEL-um", "en": "compares intended vs actual; corrects errors", "zh": "小腦", "sig": "伸過頭、來回晃、稜鏡適應不了、酒測"}, {"n": 16, "t": "Substantia nigra", "s": "sub-STAN-shuh NY-gruh", "en": "dopamine; the GAS", "zh": "黑質", "sig": "帕金森、先憂鬱"}, {"n": 16, "t": "Striatum (caudate, putamen)", "s": "stry-AY-tum", "en": "the BRAKES", "zh": "紋狀體", "sig": "杭丁頓、尾核殼核萎縮"}, {"n": 16, "t": "Parkinson disease", "s": "PAR-kin-sun", "en": "not enough gas: rest tremor, hard to start moving", "zh": "帕金森", "sig": "靜止會抖、門口卡住"}, {"n": 16, "t": "Huntington disease", "s": "HUN-ting-tun", "en": "broken brakes: jerky movements, dominant gene", "zh": "杭丁頓", "sig": "停不下來的抽動、父母也有"}, {"n": 16, "t": "Demyelination", "s": "dee-my-uh-lih-NAY-shun", "en": "myelin lost; slow, scattered signals", "zh": "髓鞘流失", "sig": "皮質肌肉正常、訊號慢又散"}, {"n": 17, "t": "Mirror neurons", "s": "MIR-er NOOR-onz", "en": "fire when doing and watching", "zh": "鏡像神經元", "sig": "坐著看別人做、模仿"}, {"n": 18, "t": "Drive reduction", "s": "DRIVE rih-DUK-shun", "en": "push: removing a need", "zh": "驅力降低", "sig": "餓了吃到不餓"}, {"n": 18, "t": "Reward / incentive", "s": "rih-WARD / in-SEN-tiv", "en": "pull: wanting something pleasant", "zh": "獎賞", "sig": "飽了還吃蛋糕"}, {"n": 18, "t": "Homeostasis", "s": "hoh-mee-oh-STAY-sis", "en": "the concept of keeping balance", "zh": "恆定", "sig": "維持穩定（概念）"}, {"n": 18, "t": "Set point", "s": "SET POINT", "en": "the specific target value", "zh": "設定值", "sig": "37 度、發燒調高"}, {"n": 19, "t": "Endotherm", "s": "EN-doh-therm", "en": "makes own heat", "zh": "內溫動物", "sig": "松鼠、人"}, {"n": 19, "t": "Ectotherm", "s": "EK-toh-therm", "en": "heat from environment", "zh": "外溫動物", "sig": "蜥蜴曬太陽"}, {"n": 19, "t": "Hyperthermia / hypothermia", "s": "hy-per-THER-mee-uh / hy-poh-", "en": "too hot / too cold", "zh": "體溫過高／過低", "sig": "hyper 多、hypo 少"}, {"n": 20, "t": "Preoptic area (POA)", "s": "pree-OP-tik", "en": "hypothalamic warm/cold sensing neurons", "zh": "視前區", "sig": "發燒、發抖、流汗"}, {"n": 20, "t": "Pyrogens", "s": "PY-roh-jenz", "en": "raise the set point (fever)", "zh": "致熱原", "sig": "正常體溫卻發抖"}, {"n": 21, "t": "Isotonic", "s": "eye-soh-TON-ik", "en": "equal concentration; no net water movement", "zh": "等張", "sig": "不變"}, {"n": 21, "t": "Hypotonic", "s": "hy-poh-TON-ik", "en": "outside more dilute; water enters; cell swells", "zh": "低張", "sig": "很稀的點滴、喝太多水"}, {"n": 21, "t": "Hypertonic", "s": "hy-per-TON-ik", "en": "outside more concentrated; water leaves; cell shrinks", "zh": "高張", "sig": "吃鹹、3% 鹽水"}, {"n": 22, "t": "Osmotic thirst", "s": "oz-MOT-ik", "en": "cells shrink; OVLT osmoreceptors", "zh": "滲透壓口渴", "s let voice=null;function pick(){try{const v=speechSynthesis.getVoices().filter(x=>/^en(-|_)US/i.test(x.lang));voice=v.find(x=>/Samantha|Google US English|Aria|Jenny|Natural/i.test(x.name))||v[0]||null;}catch(e){}}
try{pick();speechSynthesis.onvoiceschanged=pick;}catch(e){}
function speak(t,rate){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||0.85;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}}
const ch=n=>n<=4?6:n<=11?7:n<=17?8:n<=25?9:10;
const L=document.getElementById('list');let cur=0;
G.forEach(g=>{ if(ch(g.n)!==cur){cur=ch(g.n);const h=document.createElement('div');h.className='chh';h.textContent='第 '+cur+' 章';L.appendChild(h);}
 const d=document.createElement('div');d.className='voc';
 d.innerHTML=`<button class="sp" aria-label="pronounce">🔊</button><div><div class="w">${g.t}</div><div class="s">${g.s}</div><div class="z">${g.zh}</div><div class="en2">${g.en}</div><div class="sig">${g.sig}</div></div>`;
 d.querySelector('.sp').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}speak(g.t);};L.appendChild(d);});
document.getElementById('all').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}G.forEach(g=>{speak(g.t,0.8);speak(g.en,0.9);});};
document.getElementById('stop').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}};
</script></body></html>
